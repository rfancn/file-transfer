services:
  ft-server:
    image: rfancn/file-transfer:${VERSION:-latest}
    container_name: ft-server
    restart: unless-stopped
    ports:
      - "${FT_PORT:-8080}:8080"
    environment:
      TZ: Asia/Shanghai
      # RustFS 与本服务同机部署，默认通过 host-gateway 访问宿主机
      FT_S3_ENDPOINT: ${FT_S3_ENDPOINT:-http://host.docker.internal:9000}
      FT_BUCKET: ${FT_BUCKET:-file-transfer}
    volumes:
      # 与容器内默认配置路径、日志路径保持一致，无需额外环境变量
      - ./config:/etc/file-transfer
      - ./secrets:/app/secrets
      - ./logs:/var/log/file-transfer
